version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hema_backend
    restart: unless-stopped
    volumes:
      - ./models:/app/models
      - ./config:/app/config
      - ./database:/app/database
      - ./logs:/app/logs
      - ./data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: hema_frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # INTERNAL_API_URL helps Next.js SSR hit the backend directly via internal Docker network
      - INTERNAL_API_URL=http://backend:8000/api/v1
      # NEXT_PUBLIC_API_URL is sent to the browser.
      # If not set in .env.production, it defaults to /api/v1 which routes through Nginx.
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: hema_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
