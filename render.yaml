# render.yaml - Blueprints for Render.com
# Dùng cho project HMAI trên Render
# Backend: https://hmai-backend.onrender.com
# Frontend: https://hmai-frontend.onrender.com

services:
  # ─── BACKEND: FastAPI + ONNX ───────────────────────────────────────
  - type: web
    name: hmai-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ONNX_NUM_THREADS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./data/hemavision.sqlite3"
      # FRONTEND_URL dùng cho CORS - cho phép cả frontend Render và local dev
      - key: FRONTEND_URL
        value: "https://hmai-frontend.onrender.com"
      # CORS_ALLOW_ORIGINS: cho phép tất cả origin cần thiết
      - key: CORS_ALLOW_ORIGINS
        value: "https://hmai-frontend.onrender.com,https://hmai-frontend.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: APP_NAME
        value: "HMAI - HemaVision AI"
      - key: LOG_LEVEL
        value: "INFO"
      - key: INFERENCE_RATE_LIMIT
        value: "30/minute"
      # ── ML Library Warning Suppression ─────────────────────────────
      - key: MPLBACKEND
        value: "Agg"
      - key: MPLCONFIGDIR
        value: "/tmp/matplotlib"
  # ─── FRONTEND: Next.js Standalone ─────────────────────────────────
  - type: web
    name: hmai-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerContext: ./frontend-next
    dockerfilePath: frontend-next/Dockerfile
    envVars:
      # QUAN TRỌNG: Dùng relative path /api/v1 để browser tự động gọi đúng backend
      # Khi deploy, Render sẽ proxy /api/* từ frontend sang backend
      - key: NEXT_PUBLIC_API_URL
        value: "/api/v1"
      # INTERNAL_API_URL dùng cho server-side rendering (SSR) gọi trực tiếp backend
      - key: INTERNAL_API_URL
        value: "https://hmai-backend.onrender.com/api/v1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
