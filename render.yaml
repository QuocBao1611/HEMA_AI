# render.yaml - Blueprints for Render.com
services:
  # ─── BACKEND: FastAPI + ONNX ───────────────────────────────────────
  - type: web
    name: hema-backend
    runtime: docker
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: MODEL_GDRIVE_ID
        sync: false   # Điền ID file Google Drive của bạn trên Render Dashboard
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ONNX_NUM_THREADS
        value: "1"

  # ─── FRONTEND: Next.js Standalone ─────────────────────────────────
  - type: web
    name: hema-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerContext: ./frontend-next
    dockerfilePath: Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://hema-backend.onrender.com/api/v1" # Sửa lại URL thật sau khi backend deploy
      - key: INTERNAL_API_URL
        value: "https://hema-backend.onrender.com/api/v1" # Sửa lại URL thật sau khi backend deploy
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
