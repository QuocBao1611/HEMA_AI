# render.yaml - Blueprints for Render.com
services:
  # ─── BACKEND: FastAPI + ONNX ───────────────────────────────────────
  - type: web
    name: hema-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ONNX_NUM_THREADS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./data/hemavision.sqlite3"
      - key: FRONTEND_URL
        value: "https://hema-frontend-0os3.onrender.com"
      - key: CORS_ALLOW_ORIGINS
        value: "https://hema-frontend-0os3.onrender.com,https://hema-frontend.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: APP_NAME
        value: "HemaVision AI"
      - key: LOG_LEVEL
        value: "INFO"
      - key: INFERENCE_RATE_LIMIT
        value: "30/minute"
      # Google Drive file ID for best9.onnx model download at startup
      # Set this to your actual Google Drive file ID for automatic model download
      - key: MODEL_GDRIVE_ID
        sync: false
      # Optional: uncomment and set your actual Google Drive file ID
      # - key: MODEL_GDRIVE_ID
      #   value: "YOUR_FILE_ID_HERE"

  # ─── FRONTEND: Next.js Standalone ─────────────────────────────────
  - type: web
    name: hema-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerContext: ./frontend-next
    dockerfilePath: frontend-next/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://hema-backend.onrender.com/api/v1"
      - key: INTERNAL_API_URL
        value: "https://hema-backend.onrender.com/api/v1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
